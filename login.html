<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            perspective: 1000px;
        }

        /* 3D Grid Background */
        .grid-3d {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                linear-gradient(rgba(0, 150, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 150, 255, 0.15) 1px, transparent 1px),
                linear-gradient(rgba(0, 100, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 100, 255, 0.1) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            transform: rotateX(60deg) rotateZ(45deg) translateZ(-100px);
            z-index: 1;
        }

        /* Blue Neon Pulse Effect */
        .neon-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.2) 0%, transparent 70%);
            animation: pulse 4s infinite alternate;
            z-index: 2;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.7; }
        }

        /* Neon Lines */
        .neon-line {
            position: absolute;
            background: rgba(0, 150, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.5);
            z-index: 2;
        }

        .line-1 {
            width: 100%;
            height: 1px;
            top: 20%;
            animation: lineGlow 3s infinite alternate;
        }

        .line-2 {
            width: 100%;
            height: 1px;
            bottom: 20%;
            animation: lineGlow 3s infinite alternate-reverse;
        }

        @keyframes lineGlow {
            0% { box-shadow: 0 0 10px rgba(0, 150, 255, 0.5); }
            100% { box-shadow: 0 0 20px rgba(0, 150, 255, 0.8), 0 0 30px rgba(0, 150, 255, 0.6); }
        }

        /* Login Container */
        .login-container {
            position: relative;
            width: 380px;
            padding: 40px;
            background: rgba(10, 15, 30, 0.8);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
            z-index: 10;
            border: 1px solid rgba(0, 150, 255, 0.3);
            backdrop-filter: blur(5px);
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #0066ff, #00a2ff, #0066ff);
            z-index: -1;
            border-radius: 12px;
            animation: borderGlow 3s linear infinite;
            background-size: 400%;
            opacity: 0.7;
        }

        @keyframes borderGlow {
            0% { background-position: 0 0; }
            50% { background-position: 400% 0; }
            100% { background-position: 0 0; }
        }

        h2 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.7);
            letter-spacing: 2px;
        }

        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 10px 10px 35px;
            background: rgba(20, 25, 40, 0.8);
            border: none;
            border-bottom: 2px solid rgba(0, 150, 255, 0.5);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.5s;
        }

        .input-group input:focus {
            border-bottom: 2px solid #00a2ff;
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.5);
        }

        .input-group i {
            position: absolute;
            left: 10px;
            top: 10px;
            color: rgba(0, 150, 255, 0.7);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #0066ff, #0033cc);
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.5s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.5);
        }

        .btn:hover {
            background: linear-gradient(45deg, #0033cc, #0066ff);
            box-shadow: 0 0 15px rgba(0, 150, 255, 0.7);
            transform: translateY(-2px);
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .links a {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-decoration: none;
            transition: 0.3s;
        }

        .links a:hover {
            color: #00a2ff;
            text-shadow: 0 0 5px rgba(0, 150, 255, 0.5);
        }

        /* Floating particles */
        .particle {
            position: absolute;
            background: rgba(0, 150, 255, 0.5);
            border-radius: 50%;
            filter: blur(1px);
            z-index: 3;
        }

        /* 3D Cube Effect */
        .cube {
            position: absolute;
            width: 100px;
            height: 100px;
            transform-style: preserve-3d;
            animation: rotate 20s infinite linear;
            z-index: 0;
            opacity: 0.3;
        }

        .cube div {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 150, 255, 0.1);
            border: 1px solid rgba(0, 150, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.5);
        }

        .front { transform: translateZ(50px); }
        .back { transform: translateZ(-50px); }
        .right { transform: rotateY(90deg) translateZ(50px); }
        .left { transform: rotateY(-90deg) translateZ(50px); }
        .top { transform: rotateX(90deg) translateZ(50px); }
        .bottom { transform: rotateX(-90deg) translateZ(50px); }

        @keyframes rotate {
            0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="grid-3d"></div>
    <div class="neon-pulse"></div>
    <div class="neon-line line-1"></div>
    <div class="neon-line line-2"></div>
    
    <!-- Fixed Position Cubes -->
    <div class="cube" style="top:20%; left:10%;">
        <div class="front"></div>
        <div class="back"></div>
        <div class="right"></div>
        <div class="left"></div>
        <div class="top"></div>
        <div class="bottom"></div>
    </div>
    <div class="cube" style="top:70%; left:80%; width:150px; height:150px;">
        <div class="front"></div>
        <div class="back"></div>
        <div class="right"></div>
        <div class="left"></div>
        <div class="top"></div>
        <div class="bottom"></div>
    </div>
    
    <!-- Additional fixed cubes -->
    <div class="cube" style="top:10%; left:70%; width:80px; height:80px;">
        <div class="front"></div>
        <div class="back"></div>
        <div class="right"></div>
        <div class="left"></div>
        <div class="top"></div>
        <div class="bottom"></div>
    </div>
    <div class="cube" style="top:80%; left:20%; width:120px; height:120px;">
        <div class="front"></div>
        <div class="back"></div>
        <div class="right"></div>
        <div class="left"></div>
        <div class="top"></div>
        <div class="bottom"></div>
    </div>
    
    <div class="login-container">
        <h2>Gamer Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class="links">
                <a href="#">Forgot Password?</a>
                <a href="#">Create Account</a>
            </div>
        </form>
    </div>

    <script>
        // Create consistent floating particles
        function createParticles() {
            const particlesCount = 30; // Reduced for better performance
            const fixedPositions = [
                { left: 10, top: 15, size: 3 },
                { left: 85, top: 20, size: 4 },
                { left: 25, top: 70, size: 5 },
                { left: 75, top: 65, size: 3 },
                { left: 50, top: 30, size: 4 },
            ];
            
            // Create fixed position particles
            fixedPositions.forEach(pos => {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                particle.style.width = `${pos.size}px`;
                particle.style.height = `${pos.size}px`;
                particle.style.left = `${pos.left}vw`;
                particle.style.top = `${pos.top}vh`;
                
                const duration = Math.random() * 20 + 10;
                const delay = Math.random() * 5;
                particle.style.animation = `float ${duration}s linear ${delay}s infinite`;
                
                document.body.appendChild(particle);
                
                // Fixed animation for particles
                const keyframes = `
                    @keyframes float {
                        0% {
                            transform: translate(0, 0);
                            opacity: 0.5;
                        }
                        50% {
                            opacity: 0.8;
                        }
                        100% {
                            transform: translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px);
                            opacity: 0.5;
                        }
                    }
                `;
                
                const style = document.createElement('style');
                style.innerHTML = keyframes;
                document.head.appendChild(style);
            });
        }
        
        // Form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Simple login validation
            const validUsername = "user"; // Replace with your valid username
            const validPassword = "pass"; // Replace with your valid password
            
            if(username === validUsername && password === validPassword) {
                // Redirect to index.html upon successful login
                window.location.href = "index.html";
            } else {
                alert('Invalid username or password. Please try again.');
            }
        });
        
        // Initialize effects when DOM is fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
        });
        
        // Dynamic effects
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.neon-pulse');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            glow.style.background = `radial-gradient(circle at ${x * 100}% ${y * 100}%, rgba(0, 150, 255, 0.3) 0%, transparent 70%)`;
        });
    </script>
</body>
</html>
